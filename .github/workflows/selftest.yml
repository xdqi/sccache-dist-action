name: selftest
on: [workflow_dispatch]
jobs:
  workers:
    strategy:
      matrix: { idx: [1, 2] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }
      - name: Install sccache engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.0.1 -R xdqi/sccache-dist-action \
            -p 'sccache-sccache-dist-poc-tweaks-linux-amd64' \
            -p 'sccache-dist-sccache-dist-poc-tweaks-linux-amd64' -D /tmp/engine --clobber
          install -m755 /tmp/engine/sccache-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache"
          install -m755 /tmp/engine/sccache-dist-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache-dist"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sccache" --version
      - uses: ./
        with:
          mode: worker
          worker-index: ${{ matrix.idx }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }
      - name: Install sccache engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.0.1 -R xdqi/sccache-dist-action \
            -p 'sccache-sccache-dist-poc-tweaks-linux-amd64' \
            -p 'sccache-dist-sccache-dist-poc-tweaks-linux-amd64' -D /tmp/engine --clobber
          install -m755 /tmp/engine/sccache-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache"
          install -m755 /tmp/engine/sccache-dist-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache-dist"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sccache" --version
      - name: Cache sccache objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-redis-${{ github.run_id }}
          restore-keys: sccache-${{ runner.os }}-redis-
      - id: farm
        uses: ./
        with:
          mode: coordinator
          expected-workers: 2
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Build redis via the farm
        run: |
          echo "SCCACHE_J=$SCCACHE_J workers=$SCCACHE_WORKERS_ONLINE"
          sccache --zero-stats || true
          git clone --depth 1 https://github.com/redis/redis
          cd redis
          make -j"${SCCACHE_J:-4}" CC="sccache gcc" MALLOC=libc CFLAGS="-Wno-error" || true
          echo "=== sccache -s ==="
          sccache -s
          sccache -s | grep -A1 "Successful distributed compiles" | grep -qE '[1-9]' \
            && echo "DISTRIBUTION CONFIRMED" || { echo "no distribution"; exit 1; }

