name: smoke-defconfig
# Heavier smoke: 3 workers build the x86_64 defconfig kernel (thousands of C
# TUs -> real farm load) with gcc distributed via sccache-dist, then boot the
# resulting bzImage in QEMU. Only bzImage is built (no modules); QEMU reaching
# init (VFS panic on no rootfs) proves the distributed-built kernel is sound.
on: [workflow_dispatch]
jobs:
  workers:
    strategy:
      matrix: { idx: [1, 2, 3] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }
      - name: Install sccache engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.0.1 -R xdqi/sccache-dist-action \
            -p 'sccache-sccache-dist-poc-tweaks-linux-amd64' \
            -p 'sccache-dist-sccache-dist-poc-tweaks-linux-amd64' -D /tmp/engine --clobber
          install -m755 /tmp/engine/sccache-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache"
          install -m755 /tmp/engine/sccache-dist-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache-dist"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sccache" --version
      - uses: ./
        with:
          mode: worker
          worker-index: ${{ matrix.idx }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version: '1.26' }
      - name: Install sccache engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.0.1 -R xdqi/sccache-dist-action \
            -p 'sccache-sccache-dist-poc-tweaks-linux-amd64' \
            -p 'sccache-dist-sccache-dist-poc-tweaks-linux-amd64' -D /tmp/engine --clobber
          install -m755 /tmp/engine/sccache-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache"
          install -m755 /tmp/engine/sccache-dist-sccache-dist-poc-tweaks-linux-amd64 "$HOME/.local/bin/sccache-dist"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sccache" --version
      - name: Kernel build deps + qemu
        run: sudo apt-get update && sudo apt-get install -y flex bison libelf-dev bc libssl-dev qemu-system-x86
      - id: farm
        uses: ./
        with:
          mode: coordinator
          expected-workers: 3
          min-workers: 1
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Build defconfig bzImage via the farm
        run: |
          echo "SCCACHE_J=$SCCACHE_J workers=$SCCACHE_WORKERS_ONLINE"
          git clone --depth 1 https://github.com/torvalds/linux.git linux
          cd linux
          make x86_64_defconfig
          # C distributes via sccache-dist; .S compiles locally (engine forces it).
          # Build ONLY bzImage (no modules) — QEMU boot is the success proof.
          make -j"${SCCACHE_J:-6}" CC="sccache gcc" bzImage
          test -f arch/x86/boot/bzImage
          echo "=== sccache -s ==="
          sccache -s
      - name: Boot bzImage in QEMU
        working-directory: linux
        run: |
          # No rootfs: a successful boot runs init and panics on "no working init"
          # / "Unable to mount root fs" — that panic IS proof the kernel booted.
          set +e
          timeout 120 qemu-system-x86_64 -nographic -no-reboot \
            -kernel arch/x86/boot/bzImage -append "console=ttyS0 panic=-1" 2>&1 | tee boot.log
          set -e
          grep -q "Linux version" boot.log || { echo "no kernel banner"; exit 1; }
          grep -Eq "VFS: Unable to mount root fs|No working init|Kernel panic" boot.log \
            && echo "SMOKE-DEFCONFIG boot = PASS (kernel reached init)" \
            || { echo "banner seen but never reached init"; exit 1; }
      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: defconfig-boot-log
          path: linux/boot.log
          if-no-files-found: ignore
